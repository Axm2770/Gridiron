name: Desktop builds and releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'scripts/package-desktop.mjs'
      - 'scripts/check-mac-launch.mjs'
      - 'scripts/check-windows-launch.mjs'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'scripts/package-desktop.mjs'
      - 'scripts/check-*-launch.mjs'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  macOS:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package, sign and launch native app
        run: npm run package:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Gridiron-Director-macOS-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package and launch native app
        run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Gridiron-Director-Windows-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
  # A pushed version tag (v1.2.3) publishes the launch-tested ZIPs as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macOS, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Installed apps read this manifest to update in-game without a reinstall.
      - name: Build in-game update manifest
        run: node scripts/content-manifest.mjs downloads/content-manifest.json "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed "s/<version>/${version}/g" .github/release-notes.md > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${GITHUB_REF_NAME}" downloads/*.zip downloads/content-manifest.json \
            --title "Gridiron Director ${version}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
