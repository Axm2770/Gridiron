name: macOS desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'scripts/package-desktop.mjs'
      - 'scripts/check-mac-launch.mjs'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
permissions:
  contents: read
jobs:
  macOS:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package, sign and launch native app
        run: npm run package:mac:${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: Gridiron-Director-macOS-${{ matrix.arch }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
