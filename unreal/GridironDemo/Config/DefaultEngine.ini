[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Gridiron/Maps/Greybox.Greybox
GameDefaultMap=/Game/Gridiron/Maps/Greybox.Greybox

[/Script/Engine.RendererSettings]
; PSO precaching is off: in cooked builds on UE 5.8 + NVIDIA it made D3D12 pipeline creation fail at
; startup (E_OUTOFMEMORY 8007000e) and crash the packaged renderer. On D3D12 the bundled PSO cache
; below avoids first-use hitches instead. (On D3D11, the packaged build's fallback when D3D12 device
; creation fails, there are no PSOs: precompiled shaders come from the cooked shader library.)
r.PSOPrecaching=0
r.DefaultFeature.MotionBlur=False

[DevOptions.Shaders]
; The cook writes shader stable keys (.scl.csv), which turn a recorded PSO log into the bundled cache
; (Build/Windows/PipelineCaches/*.spc, made by unreal/Tools/perf.ps1 -RecordPSO).
NeedsShaderStableKeys=true

[ConsoleVariables]
; Compile the bundled pipeline cache while the renderer starts, before plays need those shaders.
r.ShaderPipelineCache.Enabled=1

[/Script/Engine.PhysicsSettings]
; Fixed physics substeps keep hit reacts and ragdolls stable at any frame rate.
bSubstepping=True
MaxSubstepDeltaTime=0.008333
MaxSubsteps=6

